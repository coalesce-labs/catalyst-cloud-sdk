name: Publish

# Publishes @catalyst-cloud/sdk to the public npm registry when a GitHub Release is published.
# Flow: bump "version" in package.json + commit → cut a Release tagged vX.Y.Z → this workflow
# builds, tests, and `npm publish`es that version. npm rejects re-publishing an existing version,
# so each release must carry a fresh version. Auth is npm trusted publishing (CTC-3301): npmjs.com
# trusts this repo's publish.yml, and `npm publish` trades the job's OIDC token for a short-lived
# publish credential. There is no NPM_TOKEN to expire (the old one did, 90 days after 2026-06-26).
# A release runs the publish.yml AT THE TAGGED COMMIT, so a tag cut before this file changed still
# uses the old auth. Provenance is generated automatically.

on:
  release:
    types: [published]
  workflow_dispatch: # manual re-run (still gated on the version being unpublished)

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    name: build · test · publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11 && npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (tsc → dist/)
        run: bun run build

      - name: Test
        run: bunx vitest run

      - name: Publish to npm (public, with provenance)
        run: npm publish --provenance --access public

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: install · build · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release train
        run: bun run release:check

      - name: Build (tsc → dist/)
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      # CTC-672 — the drift detector lives in scripts/, which the package tsconfig deliberately
      # excludes (it must stay free of @types/node so browser consumers do not inherit it). Without
      # this step the detector could stop compiling and nothing would say so until the cron ran.
      - name: Typecheck scripts/
        run: bun run typecheck:scripts

      - name: Test
        run: bunx vitest run

      - name: Packed consumer and optional module boundaries
        run: bun run test:pack

  # CTC-9951: a working document belongs in the run's artifact directory, never on a branch of this
  # public repository. A repository whose default branch tracks its own thoughts/ keeps them.
  no-thoughts-documents:
    name: no thoughts documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse thoughts/ documents the default branch does not track
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          git fetch -q --no-tags --depth=1 origin "refs/heads/${BASE}"
          if [ -n "$(git ls-tree --name-only FETCH_HEAD -- thoughts)" ]; then
            echo "${BASE} tracks thoughts/, so this repository keeps its own."
            exit 0
          fi
          paths="$(git ls-tree -r --name-only HEAD -- thoughts)"
          if [ -z "${paths}" ]; then
            echo "No thoughts/ documents."
            exit 0
          fi
          echo "${paths}" | while read -r path; do
            echo "::error file=${path}::${path} is a thoughts/ document, and ${BASE} does not track thoughts/. Remove it from this branch."
          done
          exit 1
